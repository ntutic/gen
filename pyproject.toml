[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vclist"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "chompjs>=1.3,<2",
  "itemloaders>=1.3,<2",
  "jmespath>=1,<2",
  "openpyxl>=3.1.5,<4",
  "pdfplumber>=0.11,<0.12",
  "python-dotenv>=1.2,<2",
  "Scrapy>=2.18,<3",
  "Shapely>=2.1,<3",
  "selenium>=4.39,<5",
  "seleniumbase>=4.45,<5",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=9,<10", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
include = ["scrapectl*", "scraping*"]
exclude = ["docs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:seleniumbase"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
